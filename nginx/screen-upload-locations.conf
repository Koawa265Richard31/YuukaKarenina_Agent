  # Windows 屏幕截图上传（astrbot_screen_watch 插件，鉴权走插件 token，绕过 basic auth）
  # 用法：include 进 63000 的 server block（location / 之前）
  location /screen/upload {
    auth_basic off;
    client_max_body_size 20m;
    proxy_pass http://127.0.0.1:6201;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 120s;
  }
