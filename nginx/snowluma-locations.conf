  location = /snowluma-qr.png {
    alias /var/run/snowluma/qr-crop.png;
    add_header Cache-Control "no-store";
    types { image/png png; }
  }

  location = /snowluma-qr.html {
    alias /var/www/snowluma/qr.html;
    add_header Cache-Control "no-store";
  }

  location = /snowluma-status.json {
    alias /var/run/snowluma-watchdog/status.json;
    add_header Cache-Control "no-store";
    default_type application/json;
  }

